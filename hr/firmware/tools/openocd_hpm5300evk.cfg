# openocd target config for HPM5300EVK + the on-board FT2232 debug probe.
#
# The SDK's hpm5300_all_in_one.cfg expects HPM_SDK_BASE / BOARD / PROBE as
# openocd variables -- openocd has no access to environment variables, so they
# are set here. Referenced by flash.bat and serial_capture.py.
#
#   flash : openocd -f tools/openocd_hpm5300evk.cfg -c "init; halt; \
#               flash write_image erase <elf>; verify_image <elf>; reset run; shutdown"
#   reset : openocd -f tools/openocd_hpm5300evk.cfg -c "init; reset run; shutdown"

set HPM_SDK_BASE D:/sdk_env_v1.12.1/hpm_sdk
set BOARD hpm5300evk
set PROBE ft2232

source ${HPM_SDK_BASE}/boards/openocd/hpm5300_all_in_one.cfg
