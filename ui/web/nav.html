<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航 · 灵途智行</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/pages.css">
<style>
/* =========================================================================
   导航（左栏「导航」那一项的目标页）
   -------------------------------------------------------------------------
   ★ 版面口径（2026-09-25 用户拍板，**这一版是最终口径**；前面几版"右边三张
     卡""逐段拆解""单独一块小瑞聊天框"都是过程稿，已经被删掉了）：

   1. **顶上一条搜索栏**：最左边只有一个返回箭头（⚠️ 2026-09-25 用户点名把
      「导航」标题连着图标一起去掉了 —— 左栏那一格已经写着导航，重复），
      然后是**起点、终点竖着排成的**一列（用户原话：「起终点在一列 不要分开」；
      起点占位符「当前位置」、终点「请输入目的地」，交换键在整列右边），
      再往右是「重新定位」和「搜索路线」两颗键，最右边是连接状态。
   2. **中间地图是页面第一视觉**：地图占满内容区宽度，**一张图上同时画三条
      候选路线**（深蓝主推荐 / 浅蓝备选一 / 灰备选二，带行驶方向箭头），
      起点绿色车辆点、终点红色目的地标。
   3. **路线面板叠在地图右侧**（半透明浅蓝玻璃、圆角，**一块，不拆卡**）：
      标题「候选路线」+ 三条路线（名称 / 里程 / 用时 / 简要说明，第一条选中、
      深蓝高亮边框）+ 当前那条的导航信息（目的地 / 剩余距离 / 预计到达）
      + 底部两颗主键「开始导航」「语音输入」。
   4. **地图右下角一条小气泡**：驾驶监测报疲劳时才出现，「检测到疲劳，是否推荐
      就近服务区休整？」+「忽略」「查看服务区」。**视觉权重低**，不挡正常导航。
   5. ★★ **「开始导航」之后要真的进导航**（2026-09-25 用户拍板，改的就是第 4 版
      里那条"只给概览"的旧口径）：「开始导航后 肯定要进入实际了啊 有直行那些
      前方多少公里有红绿灯那些 这不是最基本的吗」。所以导航态是——
        · 地图左上角一条**引导条**：转向图标 + 「直行 / 左转 / 右转 / 掉头 / 到达」
          + 高德那一句原话（「沿静台路向东行驶686米左转」）+ 底下三个数
          （本段多少米 · 红绿灯几个 · 约几分钟）+ 「第 3 / 8 段」；
        · 面板里换成**逐段清单**（导航态下替掉候选路线那三行），点一段：图上
          那一段单独亮出来（每段自己那份折线是高德给的，见 `ui/amap.py`）。
      🔴 **但"前方 500 米右转"这种会自己变小的数**，这一页**给不出来也不许编**：
        这台机器上"车在哪"是拿不到的（见 `tryGeo()` 那段），没有实时位置就没有
        "还剩多少米"。所以它是**全程预览**：段和段不会自己往前走，人点哪段看哪段。
        屏上每个字每个数都是高德给的（`step_distance` / `cost.traffic_lights` /
        `instruction`），**一句"路况顺畅"都没有**。

   ⚠️ 三条老规矩在这一版**依然有效**，改这一页之前先看：

   1. 🔴 **查不到就是查不到，一个数都不许给。** 定位拿不到 / 高德连不上 / 附近
      没搜到 —— 这三种情况下这一页显示全是「—」加一句人话，**不画车、不画路线、
      不给公里数**。这一页存在的全部理由，就是原来那句「前方 12 公里有一个服务区」
      是**编的**；编一个默认坐标比不显示坏得多，因为它看起来是真的。
      ⚠️ 用户给的样张里那些数（28.6 公里 / 36 分钟 / 杭州东站 / 10:30）**是样例**，
        一个字都没有写进这一页 —— 屏上每个数都来自服务端那一次真查询。
   2. ★ **"地图不画"分两种情况**（看着矛盾，实际是两件事）：
      · **SDK 加载失败**（没网 / key 没配 / 白名单没加）→ 地图那一块整个不画；
      · **定位拿不到** → 地图**照画**（它只是张地图，不是关于你在哪的断言），
        但不画车、不画路线，并给出**手动起点**那几条路。
        混了会自相矛盾：定位拿不到时把地图也收掉，用户就没地方去点那个"手动起点"了。
   3. ★ **所有数字都来自服务端（`ui/amap.py`）**，页面自己一个数都不算 —— 因为
      同一件事还有第二个出口：小瑞**嘴上也会念**同一个数（`server.py` 的
      `voice_answer`）。屏上和嘴上必须是同一个来源。
   ========================================================================= */

/* ------------------------------------------------------------- 顶上搜索栏 */
/* ⚠️ `.ptitle` 是 pages.css 里的全站样式（flex + wrap + gap），这一页只是往
   里面多塞了几个控件 —— 别改它，别的地方也在用。 */
/* ★ 起点和终点**竖着摆成一列**（2026-09-25 用户：「起终点在一列 不要分开」）：
   两个框左边缘对齐、宽度一样、中间一条虚线，交换键在整列的右边 —— 和手机上的
   导航 App 是同一个形状。⚠️ 一列 = **一个** `.end-box`，不是两个并排的框：
   并排的时候它们会被 `.ptitle` 的 `flex` 拉到两头去，看着就是"分开了"。 */
.end-box{ position:relative; display:flex; flex-direction:column; flex:0 0 auto;
  width:clamp(15rem, 25vw, 22rem); padding:.12rem .3rem .12rem .6rem;
  border-radius:.72rem; background:var(--fill-2); border:1px solid var(--line); }
.end-box:focus-within{ border-color:rgba(var(--rgb),.55);
  background:rgba(var(--rgb),.06); }
.end-box .drow{ display:flex; align-items:center; gap:.4rem; }
/* 两行之间那条虚线：一眼看出是"起点在上、终点在下"的一列 */
.end-box .drow + .drow{ border-top:1px dashed var(--line); }
.end-box .ic{ display:grid; place-items:center; flex:0 0 auto; }
.end-box .ic svg{ width:1rem; height:1rem; }
/* ⚠️ 起点绿、终点红 = **地图上那两个圆点的颜色**（`draw()` 里写的 #22a06b /
   #e5484d）。一列里这两行的图标用同一个色系，人不用想就知道哪行是哪头。 */
.end-box .r-org .ic{ color:#22a06b; }
.end-box .r-dst .ic{ color:#e5484d; }
.end-box input{ flex:1 1 auto; min-width:0; font:inherit; font-size:.85rem;
  padding:.42rem .1rem; color:var(--ink); background:transparent; border:0;
  outline:0; }
.end-box input::placeholder{ color:var(--muted); }
/* 交换键：实心小圆，夹在两个框中间 —— 和高德上那颗是同一个位置、同一个意思。 */
.swap-btn{ flex:0 0 auto; width:1.9rem; height:1.9rem; display:grid;
  place-items:center; cursor:pointer; color:var(--accent);
  background:rgba(var(--rgb),.12); border:1px solid rgba(var(--rgb),.3);
  border-radius:50%; transition:.25s; }
.swap-btn:hover{ background:rgba(var(--rgb),.24); transform:rotate(180deg); }
.swap-btn svg{ width:1rem; height:1rem; }
.nav-btn{ font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  white-space:nowrap; padding:.5rem .85rem; border-radius:.72rem; transition:.22s;
  display:inline-flex; align-items:center; gap:.35rem;
  color:var(--ink-3); background:var(--fill-2); border:1px solid var(--line); }
.nav-btn:hover{ color:var(--ink); background:rgba(var(--rgb),.12);
  border-color:rgba(var(--rgb),.5); }
.nav-btn svg{ width:.9rem; height:.9rem; }
/* 「搜索路线」是这一行唯一的主键（真正的主操作是地图上那条路，但它是入口）。 */
.nav-btn.primary{ color:#fff; background:var(--accent); border-color:var(--accent); }
.nav-btn.primary:hover{ filter:brightness(1.08); }

/* 搜索栏下面那条细线：起点状态 + 一句提示。**不是装饰** —— 定位拿不到的时候，
   这一行是页面上唯一说得出"你得自己给个起点"的地方（见文件头第 2 条）。 */
.nav-sub{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
  font-size:.76rem; color:var(--ink-3); margin:-.35rem 0 .1rem; }
.org-state{ display:flex; align-items:center; gap:.4rem; }
.org-state .dot{ width:.5rem; height:.5rem; border-radius:50%; flex:0 0 auto;
  background:var(--muted); }
.org-state.on .dot{ background:#2f9e6b; }
.org-state.bad .dot{ background:#d4762f; }
.nav-sub .spacer{ flex:1 1 auto; }

/* ★★ 打字时冒出来的候选 —— 一颗**悬浮的下拉**，挂在起点/终点那一列的下面。
   ⚠️ 它**不占版面**（`position:absolute`）：2026-09-25 用户原话「我选择是在起点
      终点框那点下拉那个就顺带可以选择了啊 而不是下去挤占我地图位置 然后应该
      就和右上角那个小角标类似的效果 是独立在这个页面顶部的」。第一版是排在
      页面流里的一个块，候选一出来地图就被推下去 —— 用户当场否掉。
   ⚠️ 底色要**不透明**（.98）：它是盖在地图瓦片上的，半透明会花。
   ⚠️ `z-index` 要压过地图卡里那两条（`.nav-panel` 5 / 引导条 7）：同一个层叠
      上下文里带正 z-index 的定位元素排在所有 `z-index:auto` 的定位元素（含
      `.nav-mapwrap`）之上，30 够。⚠️ `.sub-body` 是滚动容器，但它只裁**滚动区
      之外**的东西，这个下拉落在地图那一段里，不会被裁掉。 */
.dst-list{ position:absolute; left:0; right:0; top:calc(100% + .3rem); z-index:30;
  display:flex; flex-direction:column; gap:.12rem; padding:.3rem;
  max-height:15rem; overflow-y:auto; overscroll-behavior:contain;
  border-radius:.72rem; background:rgba(255,255,255,.98);
  border:1px solid var(--line); box-shadow:0 .8rem 2rem rgba(24,52,84,.2); }
.dst-list[hidden]{ display:none; }
.dst-list button{ display:block; width:100%; text-align:left; font:inherit;
  font-size:.78rem; padding:.42rem .55rem; border-radius:.55rem; cursor:pointer;
  color:var(--ink); background:transparent; border:0; }
.dst-list button:hover{ background:rgba(var(--rgb),.12); }
.dst-list .dn{ font-weight:600; }
.dst-list .da{ display:block; font-size:.68rem; color:var(--muted); margin-top:.1rem; }
/* 下拉框里那种**不是候选**的行：「正在问高德…」「高德一条都没搜到」。
   见页面脚本里 `listNote()`：打字那条路**永远**要在框下面冒出一块东西，
   有能点的就点，没有就把为什么没有说清楚。 */
.dst-list .dtip{ display:block; padding:.42rem .55rem; font-size:.72rem;
  line-height:1.55; color:var(--ink-3); }

/* ---------------------------------------------------------------- 地图卡 */
/* ⚠️ 高度给死一个范围（不能靠子元素撑）：高德 2.0 是 WebGL 画布，容器高度 0 时
   它**不报错**、只是什么都不显示 —— 那种"空"最难查。 */
.nav-mapwrap{ position:relative; border-radius:.9rem; overflow:hidden;
  height:clamp(26rem, 66vh, 46rem); background:var(--fill-2);
  border:1px solid var(--hair-2); }
.nav-mapwrap #map{ position:absolute; inset:0; }
/* 没在画地图时盖在上面的一句话（不是遮罩，是"这块现在没有内容"）。 */
.nav-mapwrap .mapnote{
  position:absolute; inset:0; display:none; place-items:center; text-align:center;
  padding:1.4rem; font-size:.82rem; line-height:1.75; color:var(--ink-3);
  background:repeating-linear-gradient(135deg, rgba(var(--rgb),.05) 0 10px,
              transparent 10px 20px);
}
.nav-mapwrap.empty .mapnote{ display:grid; }

/* 地图上点了一下之后那条"这个点算什么"。⚠️ `[hidden]` 那条**不能省**：
   UA 样式表里 `[hidden]{display:none}` 的特异性比 `.map-pick` 低，少了它
   JS 设 `hidden` 也收不起来（前面一版就栽在这儿）。 */
.map-pick{ position:absolute; left:.6rem; top:.6rem; z-index:6;
  display:flex; align-items:center; gap:.35rem; padding:.3rem .4rem;
  border-radius:.6rem; background:rgba(255,255,255,.94);
  border:1px solid var(--hair-2); font-size:.72rem; }
.map-pick[hidden]{ display:none; }
.map-pick span{ color:var(--ink-3); padding-left:.15rem; }
.map-pick button{ font:inherit; font-size:.72rem; font-weight:600; cursor:pointer;
  padding:.25rem .55rem; border-radius:.5rem; color:var(--ink-3);
  background:var(--fill-2); border:1px solid var(--line); white-space:nowrap; }
.map-pick button:hover{ color:var(--ink); background:rgba(var(--rgb),.12);
  border-color:rgba(var(--rgb),.5); }

/* ═══════════ 叠在地图右侧的路线面板（半透明浅蓝玻璃，一整块） ═══════════ */
.nav-panel{
  position:absolute; right:.7rem; top:.7rem; z-index:5;
  width:clamp(15rem, 23vw, 20rem);
  /* ⚠️ 底部留出 ~5.4rem：那块地方是**疲劳气泡**的（用户点名"右下角"）。
     不留的话气泡会压在按钮上 —— 而那是这一页唯一的项目特色。 */
  max-height:calc(100% - 5.4rem); overflow-y:auto; overscroll-behavior:contain;
  padding:.75rem .8rem; border-radius:.9rem;
  background:linear-gradient(165deg, rgba(139,186,238,.30), rgba(255,255,255,.80));
  border:1px solid rgba(120,175,235,.5);
  box-shadow:0 .6rem 1.8rem rgba(28,62,102,.16);
  backdrop-filter:blur(10px);
}
.nav-panel::-webkit-scrollbar{ width:.3rem; }
.nav-panel::-webkit-scrollbar-thumb{ background:rgba(31,79,168,.25);
  border-radius:2rem; }
.np-head{ display:flex; align-items:center; justify-content:space-between;
  gap:.5rem; margin-bottom:.55rem; }
.np-head h3{ font-size:.92rem; font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:.4rem; }
.np-head h3 svg{ width:1rem; height:1rem; color:#1f4fa8; }
.np-head .note{ font-size:.68rem; color:var(--muted); }
.np-badge{ display:none; font-size:.66rem; font-weight:600; color:#fff;
  padding:.1rem .4rem; border-radius:.4rem; background:var(--accent); }
.pg-nav.navigating .np-badge{ display:inline-block; }
.pg-nav.navigating .nav-panel{ border-color:rgba(var(--rgb),.7); }

/* 三条候选路线：**一行一条**。第一条默认选中、深蓝高亮边框。 */
.rt-rows{ display:flex; flex-direction:column; gap:.32rem; }
.rt-rows:empty{ display:none; }
.rt-row{ display:flex; gap:.5rem; align-items:flex-start; width:100%;
  text-align:left; font:inherit; cursor:pointer; padding:.45rem .55rem;
  border-radius:.7rem; transition:.2s;
  background:rgba(255,255,255,.55); border:1px solid rgba(120,175,235,.38); }
.rt-row:hover{ border-color:rgba(31,79,168,.5); }
.rt-row.on{ background:rgba(31,79,168,.12); border-color:#1f4fa8;
  box-shadow:inset 0 0 0 1px #1f4fa8; }
/* ⚠️ 那个小圆点的颜色 = **图上那条线的颜色**（`RSTYLE` 里那三个色），
   照抄一份在 CSS 变量上会让两边各自漂移，所以点色由 JS 用内联 style 给。 */
.rt-row .sw{ flex:0 0 auto; width:.55rem; height:.55rem; border-radius:50%;
  margin-top:.34rem; }
.rt-row .sum{ flex:1 1 auto; min-width:0; }
.rt-row .l1{ display:flex; align-items:baseline; justify-content:space-between;
  gap:.4rem; }
.rt-row .nm{ font-size:.8rem; font-weight:600; color:var(--ink); }
.rt-row .km{ font-size:.78rem; font-weight:600; color:#1f4fa8;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.rt-row .l2{ font-size:.68rem; color:var(--muted); margin-top:.14rem;
  line-height:1.45; }

/* 选中那条的导航信息（目的地 / 剩余距离 / 预计到达）。 */
.np-info{ margin-top:.7rem; padding-top:.65rem;
  border-top:1px solid rgba(120,175,235,.42); }
.np-kv{ display:flex; align-items:baseline; justify-content:space-between;
  gap:.6rem; padding:.22rem .05rem; font-size:.77rem; }
.np-kv .k{ color:var(--muted); flex:0 0 auto; }
.np-kv .v{ color:var(--ink); font-weight:600; text-align:right;
  font-variant-numeric:tabular-nums; word-break:break-word; }
.np-kv .v.na{ color:var(--muted); font-weight:500; }
.np-kv .u{ font-size:.68rem; color:var(--muted); font-weight:500;
  margin-left:.2rem; }
/* 值和单位是**兄弟**、外面这一层只管贴右边。⚠️ 见 markup 里那段注释：
   单位不能再嵌回 `<span id="nbKm">` 里面 —— `put()` 用 `textContent` 写值，
   会把子节点整个删掉。 */
.np-kv .vw{ display:flex; align-items:baseline; justify-content:flex-end;
  flex:1 1 auto; min-width:0; }
/* 说明 / 为什么查不到。★ **这一行是这一页的良心**：查不到的时候，
   它必须说得出"为什么"，而不是留一整块空白让人以为还没加载完。 */
.np-over{ font-size:.72rem; line-height:1.6; color:var(--ink-3);
  padding:.45rem .55rem; border-radius:.6rem; margin-top:.6rem;
  background:rgba(255,255,255,.55); border:1px solid rgba(120,175,235,.34); }

/* 演示推进的控制（导航态才出现）：播放/暂停 · 倍速 · 跟车/全程。
   ★ 用户 2026-09-25：「我开始导航后 你地图应该变为我在一点点走啊」。 */
.sim-row{ display:flex; align-items:center; gap:.35rem; flex-wrap:wrap;
  margin-top:.6rem; padding-top:.55rem;
  border-top:1px solid rgba(120,175,235,.42); }
.sim-row[hidden]{ display:none; }
.sim-btn{ font:inherit; font-size:.72rem; cursor:pointer; padding:.3rem .6rem;
  border-radius:.5rem; color:#fff; background:#1f4fa8; border:1px solid #1f4fa8; }
.sim-btn:hover{ filter:brightness(1.08); }
.sim-btn.ghost{ color:#1f4fa8; background:rgba(255,255,255,.6);
  border-color:rgba(31,79,168,.45); }
.sim-btn.ghost.on{ color:#fff; background:#1f4fa8; }
/* ⚠️ 这里原来有一条 `.sim-note`（那一行解释"演示是怎么走的"）。2026-09-26 连同
   它的 `<span id="simNote">` 一起删了 —— 用户说解释文字不要。别再补回来。 */

/* ══════════════ 逐段引导（导航态：地图上一条引导条 + 面板里一张逐段清单） ══════════════
   ★ 这一块里**每个数都是高德给的**（文件头第 5 条那一段说全了）：
       「本段 8.2 公里」     = 那一段的 `step_distance`
       「红绿灯 4 个」       = 那一段的 `cost.traffic_lights`（v5 里逐段都有）
       「全程 12.4 公里处」  = 到这一段末尾为止各段里程之和（服务端累加的 `at_m`）
       「左转 / 右转 / 直行」= 从高德那句 `instruction` **尾巴上**读出来的动作词，
                              只用来挑一个图标，**不产生任何数**
   ★★ 2026-09-25 用户当场又提了一条：「我开始导航后 你地图应该变为我在一点点走啊
      我走过的变成灰 这不是高德最基础的功能吗」—— 于是这里**多了一层"演示推进"**
      （页面脚本里 `SIM` 那一整段），引导条上也就多了一行会变小的数：
        · 「前方 520 米右转」= 当前位置到**本段末尾那个动作**还有多少米。
      🔴 这一条**不是把原来那句"不许编"推翻了，是把它兑现了**：原来不许写，是因为
         屏幕上**没有位置** —— 没有位置却说"还剩 520 米"，那个 520 就是编的。
         现在位置是**在高德那条折线上按弧长插出来的**（起点、终点、每一段的折线、
         每一段的米数和用时**全是高德的**），所以这个 520 是从真位置量出来的，
         只是**位置本身是演示推的**。
      ⚠️ 因此"演示"两个字**必须留在屏幕上**（引导条第 4 行 + 面板那一行 + 开播
         那句播报）：数是真的，来源是演示 —— 这两件事不许含糊成一件。 */
/* 引导条放**左上角**：右边留给路线面板，右下角留给疲劳气泡。 */
.gd-box{ position:absolute; left:.7rem; top:.7rem; z-index:7;
  display:flex; align-items:flex-start; gap:.6rem;
  max-width:min(24rem, calc(100% - 1.4rem));
  padding:.55rem .7rem; border-radius:.85rem;
  background:rgba(255,255,255,.96); border:1px solid rgba(31,79,168,.35);
  box-shadow:0 .6rem 1.6rem rgba(24,52,84,.18); }
.gd-box[hidden]{ display:none; }
.gd-ic{ flex:0 0 auto; display:grid; place-items:center; width:2.2rem;
  height:2.2rem; border-radius:.6rem; color:#fff; background:#1f4fa8; }
.gd-ic svg{ width:1.5rem; height:1.5rem; }
.gd-tx{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.gd-l1{ display:flex; align-items:baseline; gap:.45rem; }
.gd-l1 b{ font-size:1rem; font-weight:700; color:var(--ink); }
.gd-at{ font-size:.68rem; color:var(--muted); white-space:nowrap; }
.gd-l2{ font-size:.78rem; line-height:1.45; color:var(--ink-2);
  margin-top:.1rem; word-break:break-word; }
.gd-l3{ font-size:.68rem; line-height:1.5; color:#1f4fa8; margin-top:.1rem;
  font-variant-numeric:tabular-nums; }
/* 引导条第 4 行 = **演示进度那一句实话**。刻意用灰绿色（不是强调色）：
   它不是高德的话，是我们自己那句"这是演示"。 */
.gd-l4{ font-size:.66rem; line-height:1.5; color:#5b6b7c; margin-top:.16rem; }

/* 「全程 N 段」那颗折叠键。用户 2026-09-25：「也不用在右边一下把所有细节都
   列出来啊」→ 逐段清单**默认收起来**，清单本身一个字没少，点一下就摊开。
   ★ 三行候选路线**不在折叠范围里**（那是选路的功能，见下面那条注释）。 */
.gd-sum{ display:block; width:100%; text-align:left; font:inherit;
  font-size:.72rem; cursor:pointer; padding:.38rem .5rem; margin-top:.1rem;
  border-radius:.55rem; color:#1f4fa8;
  background:rgba(31,79,168,.07); border:1px dashed rgba(31,79,168,.45); }
.gd-sum:hover{ background:rgba(31,79,168,.13); }
.gd-sum[hidden]{ display:none; }

/* 面板里的逐段清单（导航态才有，而且默认收着 —— 见上面那颗键）。 */
.gd-list{ display:flex; flex-direction:column; gap:.22rem; margin-top:.3rem; }
.gd-list[hidden]{ display:none; }
.gd-row{ display:flex; align-items:center; gap:.45rem; width:100%;
  text-align:left; font:inherit; cursor:pointer; padding:.4rem .5rem;
  border-radius:.6rem; transition:.18s;
  background:rgba(255,255,255,.55); border:1px solid rgba(120,175,235,.32); }
.gd-row:hover{ border-color:rgba(31,79,168,.5); }
.gd-row.on{ background:rgba(31,79,168,.12); border-color:#1f4fa8;
  box-shadow:inset 0 0 0 1px #1f4fa8; }
.gd-row .gi{ flex:0 0 auto; display:grid; place-items:center; width:1.15rem;
  height:1.15rem; color:#1f4fa8; }
.gd-row .gi svg{ width:1.15rem; height:1.15rem; }
.gd-row .gt{ flex:1 1 auto; min-width:0; font-size:.75rem; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gd-row .gm{ flex:0 0 auto; font-size:.68rem; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
/* 🔴 导航态下**候选路线那三行不许收起来**（2026-09-25 用户：「三种可选择的路呢
   为啥没了」）。这里原本有一条 `.pg-nav.navigating .rt-rows{display:none}`，
   想的是"导航时面板让位给逐段清单" —— **想错了**：那三条路是这一页的主功能之一
   （用户拍板过的"给几种情况，我自己选"），进导航反而把它们藏起来，等于一按
   「开始导航」就把路选不了了。
   → 现在的排法是**都留着**：面板从上到下 = 候选路线三行 → 逐段清单（导航态才
     有）→ 导航信息 → 两颗键。面板本来就能滚（`overflow-y:auto`），装得下。 */

/* ---------------------------------------------------------------- 底部两颗键 */
.np-foot{ display:flex; align-items:center; gap:.5rem; margin-top:.7rem; }
/* 小瑞那一格。★ 显式传 `base:'head'` —— 见文件末尾那段注释：它同时是
   `_scratch/_check_mascot.py` 里"显式 base 真的生效"的唯一靶子。 */
.np-foot .art{ flex:0 0 auto; width:2.6rem; height:2.6rem; border-radius:.7rem;
  overflow:hidden; display:grid; place-items:center; cursor:pointer;
  background:radial-gradient(circle at 50% 42%, rgba(var(--rgb),.30), var(--fill-2));
  border:1px solid rgba(var(--rgb),.20); }
/* 真图和兜底 SVG 是**同一个格子里的两层**（`grid-area:1/1` 让它们重叠）——
   不然 `display:grid` 会把两个兄弟排成两行，那一格就翻倍高。 */
.np-foot .art > *{ grid-area:1/1; }
.np-foot .art img, .np-foot .art svg{ width:100%; height:100%; object-fit:contain; }
.np-btncol{ flex:1 1 auto; display:flex; gap:.45rem; min-width:0; }
.nav-start, .nav-voice{
  flex:1 1 0; min-width:0; font:inherit; font-size:.79rem; font-weight:600;
  cursor:pointer; white-space:nowrap; padding:.5rem .5rem;
  border-radius:.68rem; display:inline-flex; align-items:center;
  justify-content:center; gap:.32rem; transition:.22s;
}
.nav-start{ color:#fff; background:var(--accent); border:1px solid var(--accent); }
.nav-start svg{ width:.95rem; height:.95rem; }
.nav-start:hover:not([disabled]){ filter:brightness(1.08);
  transform:translateY(-1px); }
/* 路线还没算出来之前它是禁用的（不是一颗死键，旁边的说明写着为什么）。 */
.nav-start[disabled]{ opacity:.42; cursor:not-allowed; }
/* 还没有路线时「开始导航」的样子。⚠️ 它**仍然是点得动的**（点了会说还差什么，
   见页面脚本那段注释）：按下去毫无反应的灰键，人只会以为这一页坏了。 */
.nav-start.off{ opacity:.5; }
.nav-voice{ color:var(--ink-3); background:rgba(255,255,255,.6);
  border:1px solid rgba(120,175,235,.5); }
.nav-voice svg{ width:.95rem; height:.95rem; }
.nav-voice:hover{ color:var(--ink); background:rgba(var(--rgb),.14); }
/* ★ 在听。**判据必须是 `aria-pressed`**：`wake.js` 的 `_render()` 给按钮加
   `.on` 的同时**会改它的 `title`**，并且在按钮里放了 `.wk-label` 的时候还会
   把那个字改成「听/停」—— 这颗键要一直写着「语音输入」，所以**不能放
   `.wk-label`**（放了就会被改字）。`aria-pressed` 是它一定会写的那个属性。 */
.nav-voice[aria-pressed="true"]{
  color:#fff; background:rgba(var(--rgb),.5); border-color:var(--accent);
  animation:micBreath 1.15s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){
  .nav-voice[aria-pressed="true"]{ animation:none;
    box-shadow:0 0 0 .18rem rgba(var(--rgb),.6); }
}
/* 状态那两行。⚠️ **类名必须是 `.wk-line / .wk-host / .wk-detail`**（style.css
   里已经有全套样式），因为 `wake.js` 的 `_render()` 是拿
   `host.parentElement.querySelector('.wk-detail')` 去找第二行的，而且它给
   host **整个重写 `className`**（写成 `wk-host <state>`）—— 用别的类名会在
   第一次 `_render()` 之后被冲掉。 */
.np-foot .wk-line{ max-width:100%; margin-top:.4rem; }
.np-foot .wk-host, .np-foot .wk-detail{ text-align:left; }

/* ★ 疲劳建议气泡：**轻量**，浮在地图右下角，不挡路线也不吃地图点击
   （用户可以完全不管它，照常导航 —— 用户原话"不影响正常导航操作"）。 */
.fat-bubble{ position:absolute; right:.7rem; bottom:.7rem; z-index:6;
  display:flex; align-items:center; gap:.5rem; max-width:min(20rem, 55%);
  padding:.45rem .5rem .45rem .65rem; border-radius:.8rem;
  background:rgba(255,255,255,.96); border:1px solid rgba(212,118,47,.45);
  box-shadow:0 .5rem 1.4rem rgba(24,52,84,.16); font-size:.75rem; }
.fat-bubble[hidden]{ display:none; }
.fat-bubble .fb-ic{ display:grid; place-items:center; flex:0 0 auto;
  width:1.4rem; height:1.4rem; border-radius:.45rem; color:#c96a1e;
  background:rgba(224,128,47,.14); }
.fat-bubble .fb-ic svg{ width:.95rem; height:.95rem; }
.fat-bubble .fb-tx{ color:var(--ink); line-height:1.45; }
.fat-bubble button{ font:inherit; font-size:.72rem; font-weight:600;
  cursor:pointer; padding:.28rem .6rem; border-radius:.5rem; white-space:nowrap; }
#fbGo{ color:#fff; background:#d4762f; border:1px solid #d4762f; }
#fbGo:hover{ filter:brightness(1.06); }
#fbStay{ color:var(--ink-3); background:var(--fill-2); border:1px solid var(--line); }
#fbStay:hover{ color:var(--ink); background:rgba(var(--rgb),.12); }
</style>
</head>
<body class="pg-nav" data-sev="normal">

<div class="bg"></div>
<div class="tint"></div>
<div class="streaks" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>

<div class="app">
  <header class="topbar" id="topbar"></header>

  <div class="main sub">
    <nav class="rail" id="rail"></nav>

    <div class="sub-body">

      <!-- ═══════════ 顶上一行：标题 + 起点/终点 + 重新定位/搜索路线 ═══════════
           ⚠️ 2026-09-25 用户**点名去掉了左上角那个标题**（连着图标一起）：左栏
             那一格已经写着「导航」了，再来一遍是重复。所以这一行里**没有 `<h1>`
             也没有 `h1ico`** —— 谁要往回加，别忘了 JS 那边也要一起回来。
           ★ 用户原话（去掉标题之后的剩下那几件）：「起点框文字为"当前位置"，
             终点框文字为"请输入目的地"，中间有交换起点和终点的按钮。搜索栏右侧
             放置"重新定位"和"搜索路线"两个功能按钮。右上角保留用户头像和连接
             状态。」那颗返回箭头留着：它是"回座舱主界面"的唯一出口。
           ★ 2026-09-25 用户把"只在回车/点按钮时才问高德"改掉了：「打字的同时
             顺带出现相关的地点下拉框」「起点也类似」「我在打一个字的时候 相关
             地点自动出现」。现在**打字就问**（一个字也问），下拉框悬浮在这一列
             下面 —— QPS 怎么兜见页面脚本里 `TYPING` 那一整段。
           ⚠️ 右上角那个「用户头像」是 `chrome.js` 的顶栏画的（全站一个），
              这一行只管右边那颗连接状态。 -->
      <div class="ptitle">
        <a class="back" href="index.html" title="返回座舱主界面" id="backBtn"></a>
        <!-- ══ 起点 / 终点：**一列**（用户 2026-09-25：「起终点在一列 不要分开」）══
             ⚠️ 这两行必须在**同一个** `.end-box` 里。分成两个并排的框的话，
                `.ptitle` 的 `flex` 会把它们推到两头，看着就是"分开了"。
             交换键在整列的右边、竖直居中。
             ★ 起点框的默认值来自电脑定位；拿不到就是**空的**（占位符还是「当前
                位置」，但我们不会假装那儿有个坐标 —— 状态写在下面那一行）。 -->
        <span class="end-box">
          <span class="drow r-org">
            <span class="ic" data-ic="car"></span>
            <input id="orgIn" list="orgPresets" type="text" autocomplete="off"
                   spellcheck="false" placeholder="当前位置">
          </span>
          <span class="drow r-dst">
            <span class="ic" data-ic="nearby"></span>
            <input id="dstIn" type="text" autocomplete="off" spellcheck="false"
                   placeholder="请输入目的地">
          </span>
          <!-- ★★ 打字时冒出来的候选 —— **悬浮**在这一列的下面（绝对定位），
               ⚠️ 它必须留在这个 `.end-box` 里：2026-09-25 用户原话「我选择是在
               起点终点框那点下拉那个就顺带可以选择了啊 而不是下去挤占我地图
               位置 然后应该就和右上角那个小角标类似的效果 是独立在这个页面
               顶部的」。它**不占版面**：map 卡不会因为候选出来而被推下去。
               ⚠️ 起点、终点**共用这一个**框：谁在打字就装谁的候选（`which` 由
               调用方给，见 `renderList()`）。 -->
          <span class="dst-list" id="dstList" hidden></span>
        </span>
        <button class="swap-btn" id="swapBtn" title="交换起点和终点">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4.5v13M8 4.5 5 7.5M8 4.5l3 3M16 19.5v-13M16 19.5l3-3M16 19.5l-3-3"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="nav-btn" id="orgRetry" title="再试一次电脑定位">
          <span data-ic="watch"></span>重新定位
        </button>
        <button class="nav-btn primary" id="dstGo">
          <span data-ic="search"></span>搜索路线
        </button>
        <span class="spacer"></span>
        <span class="pill" id="connPill">连接中…</span>
        <!-- 五个**真实高速点位**（`PRESETS`）。★ 用原生 datalist 挂在上面的
             起点框上，不再单独摆一个下拉 —— 用户这一版的版面里没有它的位置，
             而"手动起点"这条路又必须留着（这台机器上它是唯一定得出起点的路）。 -->
        <datalist id="orgPresets"></datalist>
      </div>

      <!-- 起点状态 + 一句提示。★ 定位拿不到的时候，这一行是页面上唯一说得出
           "你得自己给个起点"的地方。
           ⚠️ 这一行是**短指令**（"做什么"），不是介绍（"这一页怎么用"）——
           2026-09-26 用户把页面上的解释性段落全删了，这一行留着是因为它只在
           缺东西的时候出现，而且一句话说完。 -->
      <div class="nav-sub">
        <span class="org-state" id="orgState">
          <i class="dot"></i><span id="orgText">还没定起点</span>
        </span>
        <span class="spacer"></span>
        <span id="navHint">搜个目的地，或者在地图上点一下。</span>
      </div>

      <!-- ═════════════════════ 地图（页面第一视觉）═════════════════════ -->
      <section class="card card-pad">
        <div class="card-h">
          <h3><span data-ic="grid"></span>地图</h3>
          <!-- ★ 明写"高德地图"：这是这一页被删过一次的原因，见 chrome.js 那段 -->
          <span class="note">数据 © 高德地图</span>
        </div>

        <div class="nav-mapwrap empty" id="mapWrap">
          <div id="map"></div>

          <!-- ★ 在地图上点一下之后，这儿出来一条"这个点算什么"——和高德一样：
               同一个点既可以当起点也可以当终点，不问一句没法猜（猜错了就是
               替人做主，还得让他再点一次）。 -->
          <div class="map-pick" id="mapPick" hidden>
            <span>地图上点的位置</span>
            <button id="pkOrg">设为起点</button>
            <button id="pkDest">设为终点</button>
            <button id="pkX">取消</button>
          </div>

          <!-- ★★ 导航态引导条（地图**左上角**，右下角留给疲劳气泡）。
               ⚠️ 里面每个数都是高德给的，见文件头第 5 条。
               ★ 2026-09-25 用户：「也不会在右边一下把细节都列出来啊 在左上角该
                 几百米干嘛可以列出来 并且伴随播报」—— 所以要看的细节**都在这儿**：
                 大字 = 前方多少米 + 下一个动作，第二行 = 高德那一句原话，
                 第三行 = 本段里程/红绿灯/用时，第四行 = **这是演示**（必须有）。 -->
          <div class="gd-box" id="gdBox" hidden>
            <span class="gd-ic" id="gdIc"></span>
            <span class="gd-tx">
              <span class="gd-l1">
                <b id="gdMain">—</b><span class="gd-at" id="gdAt"></span>
              </span>
              <span class="gd-l2" id="gdSub">—</span>
              <span class="gd-l3" id="gdMeta"></span>
              <span class="gd-l4" id="gdSim"></span>
            </span>
          </div>

          <!-- ════════ 叠在地图右侧的路线面板（浅蓝玻璃，一整块）════════ -->
          <aside class="nav-panel" id="navPanel">
            <div class="np-head">
              <h3><span data-ic="list"></span><span id="npTitle">候选路线</span></h3>
              <span class="np-badge">导航中</span>
              <span class="note" id="nbNote">还没查</span>
            </div>

            <!-- 三条候选。数字全是高德给的，说明是从那些数里比出来的（见
                 `routeNote()`）——**不是**"行驶顺畅"那种没来源的话。 -->
            <div class="rt-rows" id="rtRows"></div>

            <!-- ★ 导航态才出现：**逐段引导清单**。⚠️ 它在候选路线**下面**，
                 那三行一个字都不动（用户 2026-09-25：「三种可选择的路呢 为啥
                 没了」—— 进导航不能把选路这件事收走）。点一段 = 图上那一段
                 单独亮出来 + 上面那条引导条跟着换到这一段。
                 ★ 2026-09-25 又补了一句「也不用在右边一下把所有细节都列出来啊」
                   → 清单**默认收着**，由上面那颗 `#gdSum` 摊开；
                   "现在该干嘛"由左上角那条引导条 + 播报负责。 -->
            <button class="gd-sum" id="gdSum" hidden>全程 8 段 · 点开逐段清单</button>
            <div class="gd-list" id="gdList" hidden></div>

            <!-- 选中那条的导航信息。⚠️ 静态 markup 里**不许出现数字或"公里"
                 这种单位**：查不到的时候这一页必须一个数都不带。 -->
            <div class="np-info">
              <div class="np-kv">
                <span class="k">目的地</span><span class="v" id="nbName">—</span>
              </div>
              <div class="np-kv">
                <span class="k">剩余距离</span>
                <!-- 🔴 单位那个小格子**不能嵌在值的格子里面**。第一版是
                     `<span id="nbKm">—<span id="nbKmUnit"></span></span>`，
                     而 `put()` 写值用的是 `node.textContent = …` ——
                     **`textContent` 会把子节点整个删掉**，于是第一次填完值
                     `#nbKmUnit` 就没了，下一次 `clearAll()` 里
                     `$('nbKmUnit').textContent = ''` 当场抛 TypeError，
                     而它在 `clearAll` 的中段 → 后面的清屏、重画全都不执行。

const $ = (id) => document.getElementById(id);

/* 手动起点那五个点位。★ 服务区本来就在高速上，所以这里给的是五条高速边上

/* 三条候选路线的样式。★ 颜色就是用户点名的那三种：深蓝主推荐 / 浅蓝备选 /

const RSTYLE = [

let ovOrigin = null, ovDest = null;
let ovLines = [];                // 图上那三条线（下标 = routes 的下标）
let hiIdx = -1;                  // 现在高亮的是第几条（画完/换完才知道）
let AMAP_KEY = '', AMAP_SEC = '';

let dest = null;                 // {name, address, lat, lng} —— 当前这条路的终点
let destKind = '';               // 'user'（人自己搜的）/ 'rest'（疲劳建议的服务区）
let userDest = null;             // 人自己搜的终点 —— 疲劳建议来了先存着
let lastDaily = null;            // 最近一次查询的返回值（重画 + 排错用）
let routes = [];

let navOn = false;

let pick = null;                 // 地图上刚点的那个点，等人说它算什么

/* ★★ 从**别的页面**跳进来时这一页要干嘛。
   用户 2026-09-25：「并且其他页面有导航到最近服务区 或者导航啥的按钮 要真的有这个

   ★ 认一次就消掉（`WANT = ''`）：这一趟之后的搜索不该再自动进导航 —— 那是人
     自己在下指令，不该被一个几秒前的跳转劫持。 */
let WANT = '';
/* ★★ 2026-09-26：`?ask=<id>` —— **语音跳过来那一趟要小瑞说一句话**。
   链路是：主人说「给我导航」→ 服务端判成 `rest_stop` → 发 `ev:"do"` → 上一页回执
   之后带 `?ask=rest_stop` 跳到这儿 → 这一页**定完起点**（`tryGeo`）再替它要那句话
   → 服务端说「主人，导航页给你调出来了。要不要我导到最近的服务区？」并挂上
   "待确认" → 主人说「要」→ 服务端再发一次 `ev:"do" id:"rest_stop"`，而这一页
   此刻就站在导航页上、起点也有了，于是**就地查 + 画路线 + 进导航**。
   🔴 **为什么不是 `?do=nearby`**：那是"跳过来什么都不问、直接查并进导航"。用户
      拍板的是「跳过去 + 问一句」—— 两个都带的话页面已经在导航了，问的那句就是
      多余的。判据写在 `wake.js` 的 `go:`/`rest_stop` 那一支里。
   ⚠️ **必须在起点定完之后才要**（见 `onHello` 里那一句）：`origin` 决定服务端说
      哪一句 —— 有起点才是问句、才挂得上「要」；没起点就是那句"拿不到定位"的
      实话，而且**不挂**（答应了也没坐标可查）。抢着问会永远问成第二档，
      那就成了"话和屏幕不一致"。 */
let ASK = '';
try {
  const q = new URLSearchParams(location.search);
  WANT = q.get('do') || '';
  ASK = q.get('ask') || '';
} catch (e) { WANT = ''; ASK = ''; }

/* 导航态（逐段引导）的几个变量。★ 2026-09-25 起 `stepIdx` 是**跟着演示位置走
   的**（`SIM` 那段每前进一段就更新它）；点清单里的某一段 = 把演示**挪到**那一段

let stepIdx = -1;
let ovStep = null;               // 图上那一段的高亮线（单独一条，不进 ovLines）
let ovCar = null;                // 演示里那个会动的点（`SIM` 那段）
let ovDone = null;               // 已走过那一段的灰线（同上）
/* 🔴 2026-09-26 这里原来有一条 `NAV_WHY` —— 进导航时往面板的 `#rtWhy` 里灌一段
   「导航中（演示推进）：屏幕上那个点不是定位，是拿高德给的折线和每段的里程/用时
   自己往前推的……下面是演示的控制和逐段清单。」用户点名要删（「这些解释文字不要
   给了 我说几遍了」）。⚠️ 那一版还有个毛病：`**不是定位**` 的星号是 Markdown 的
   写法，写进 `textContent` 是**原样印出来的两颗星**。
   ⚠️ 别再往面板里写介绍这一页怎么用的段落 —— 进导航时 `#rtWhy` 保持原样不动，
   现在该干嘛由左上角引导条 + 播报说，数字由面板里的格子说。 */

/* ---------------------------------------------------------------- 小工具 */
function el(id) { return document.getElementById(id); }
/** 往一个"值格子"里写东西。`txt == null` = **查不到**，写「—」并调成灰的。
 *  ⚠️ 这里**只写 textContent**（绝不 innerHTML）：值可能是高德给的地名或者
 *     人打的字，拼进 HTML 就是把外面来的字符串当标记解析。 */
function put(node, txt) {
  if (!node) return;
  node.textContent = (txt == null ? '—' : String(txt));
  node.className = (txt == null) ? 'v na' : 'v';
}
/** 面板底下那一行「为什么」。★ **有话说才出来** —— 空的只剩一个带边框的空框子，
 *  比不写还难看。
 *  🔴 2026-09-26 用户第四次说不要解释文字，点名的是这里原来那句「按高德的驾车路线
 *     算的，和图上那三条线是同一个来源。点一条换一条。」（算成功的时候什么都不用
 *     说：`公里（驾车）` 和标题右边那个 `数据 © 高德地图` 两个**标签**已经把来源
 *     说清楚了，不需要再用一句话解释一遍）。
 *  ⚠️ 所以这一行只许写三种**状态**：缺什么（起点/终点）、为什么没查成、为什么这个
 *     数只是直线距离。**不许**写"这一页怎么用"、不许解释数字是从哪来的。 */
function why(txt) {
  const n = $('rtWhy');
  if (!n) return;
  n.textContent = txt || '';
  n.hidden = !txt;              // 没话说 = 连框一起收掉
}
/** 秒 → 「9 小时 52 分」/「42 分钟」。**只是把高德那个数换个写法**，不重算。 */
function fmtDur(s) {
  const m = Math.round((s || 0) / 60);
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60);
  return (m % 60) ? (h + ' 小时 ' + (m % 60) + ' 分') : (h + ' 小时');
}
/** 现在时刻 + 高德给的用时 = 预计到达（HH:MM）。
 *  ⚠️ 这是**算出来的**，但用的是两个真数：本机的钟 + 高德那一条路线的 `drive_s`
 *     （高德自己的 App 也是这么显示的）。它是这一页唯一的"推出来的数"，
 *     所以只要路线是它算的、就一定跟着改；`by !== 'drive'` 时**不给**。 */
function fmtEta(sec) {
  const d = new Date(Date.now() + (sec || 0) * 1000);
  const p = (n) => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function mapNote(txt) {
  const w = $('mapWrap');
  if (!w) return;
  if (txt) { w.classList.add('empty'); $('mapNote').textContent = txt; }
  else { w.classList.remove('empty'); }
}
function hint(txt) { const h = $('navHint'); if (h) h.textContent = txt; }

/* -------------------------------------------------------------- 定位/起点 */
function paintOrigin() {
  const st = $('orgState'), tx = $('orgText');
  if (!st || !tx) return;
  if (!origin) {
    st.className = 'org-state';
    tx.textContent = '还没定起点';
    return;
  }
  st.className = 'org-state ' + (origin.manual ? '' : 'on');
  tx.textContent = (origin.manual ? '起点（手动）：' : '起点：') + origin.label;
}

/** 定一个起点。**四条路都走这里**：手输 / 预设点位 / 地图上点 / 电脑定位。 */
async function useOrigin(lat, lng, label, manual) {
  origin = { lat: +lat, lng: +lng, label: label || '—', manual: !!manual };
  if (window.XQ && XQ.geo) {
    XQ.geo.remember({ lat: origin.lat, lng: origin.lng, manual: origin.manual });
  }
  saveOrg();
  paintOrigin();
  $('orgIn').value = origin.label;
  await restOrRoute();
}

/**
 * 起点定了（或终点变了）之后走哪条路：
 *   · 已经有终点 → 算「起点→终点」（人自己搜的，或者疲劳建议那个服务区）；
 *   · 没有终点   → 问高德最近能停的地方（`/amap/nearby`）。
 *     ⚠️ 这一问**不是**"替用户定终点"—— 它只在**没人指定目的地**的时候发生，
 *     结果写在面板上（名字 + 公里 + "推荐休息点"），人一眼看得见这是什么。
 */
async function restOrRoute() {
  if (!origin) return null;
  if (dest) return await routeTo();
  const o = await fetchNearby(origin.lat, origin.lng);
  showResult(o, 'rest');
  return o;
}

/** 电脑自己那个位置：**先问浏览器，再问高德（IP 定位），最后才请人自己给**。 */
async function tryGeo() {
  $('orgText').textContent = '正在定位…';
  $('orgState').className = 'org-state';
  const p = (window.XQ && XQ.geo) ? await XQ.geo.ask() : null;
  if (p && p.lat != null) {
    /* ⚠️ `XQ.geo.ask()` 会**先给它 5 分钟内的缓存**（`fresh()`），那个缓存里
       可能是**人在别的页面上自己设的起点**（`remember({... manual:true})`）。
       把那种坐标说成「电脑定位」就是撒谎 —— 所以这里按 `manual` 分开说。 */
    if (p.manual) await useOrigin(p.lat, p.lng, '上次选的起点', true);
    else await useOrigin(p.lat, p.lng, '我的位置（电脑定位）', false);
    return;
  }
  // ① 浏览器定位拿不到（这台机器上就是这条）→ 试高德的城市级 IP 定位。
  const ip = await fetchJSON('/amap/ip');
  if (ip && ip.ok) {
    await useOrigin(ip.lat, ip.lng,
                    '电脑位置（IP 定位 · ' + (ip.city || ip.province) + '）', false);
    return;
  }
  // ② 两条机器定位都不成 → 用**上一次人自己定的那个起点**（存在浏览器里）。
  if (restoreOrg()) return;
  // ③ 都没有：**不编坐标**，把能自己给起点的三条路指出来。
  // 🔴 2026-09-26 这儿原来写的是「起点框里打一个地名，或者在地图上点一下。」——
  //   那是**教人怎么用这一页**（用户连说四次不许有这种句子）。状态上面两行已经
  //   说全了（`#orgText`=「定位没打开，我拿不到你在哪」、`#nbNote`=「还没定起点」），
  //   所以这一行只留**还差什么**。那三条路怎么走，是注释和页面自己该懂的事，
  //   不是印给人看的一句话。
  origin = null;
  paintOrigin();
  $('orgState').className = 'org-state bad';
  $('orgText').textContent = '定位没打开，我拿不到你在哪';
  hint('还差一个起点');
  clearAll();
  $('nbNote').textContent = '还没定起点';
  why('起点还没定。');
}

/* 起点记在浏览器里 —— 用户要的是"起点默认就是我电脑位置"，而**这台机器上两条
   机器定位都给不出坐标**（浏览器定位超时、高德 `v3/ip` 回空数组）。那就把
   "人上次自己定的那个起点"当成默认：它是个**真的、他自己选的**坐标，标签上也
   写清了是上次用的，不是我们偷偷编的。
   ⚠️ 只在**两条定位都失败**时才用它；能定位就以定位为准（车会动，人不会）。 */
const ORG_KEY = 'xq.nav.org';
function saveOrg() {
  if (!origin) return;
  try {
    localStorage.setItem(ORG_KEY, JSON.stringify(
      { lat: origin.lat, lng: origin.lng, label: origin.label }));
  } catch (e) { /* 隐私模式 / 存储满了：存不下就算了，不影响这一趟 */ }
}
function restoreOrg() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem(ORG_KEY) || 'null'); } catch (e) {
    return false;
  }
  if (!v || v.lat == null || v.lng == null) return false;
  origin = { lat: +v.lat, lng: +v.lng, label: v.label || '上次用的起点',
             manual: true };
  paintOrigin();
  $('orgIn').value = origin.label;
  hint('定位没打开，起点用上次那个。');
  restOrRoute();                    // 起点有了，照常出结果
  return true;
}

/* ------------------------------------------------------------- 问服务端 */
async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    return await r.json();
  } catch (e) {
    return { ok: false, why: '这一页连不上服务端（' + (e && e.name) + '）' };
  }
}
const fetchNearby = (lat, lng) => fetchJSON(
  '/amap/nearby?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng));
/* ★ `full=true` = **上屏那一下**（回车 / 「搜索路线」）：服务端会再并上
   `place/text` 的结果（整地名「无锡市」、看得懂的分类只有它有）。
   打字那条路**不许**带它 —— 一个字两个请求 = QPS 翻倍，见 `TYPING` 那段。
   ★ `lat`/`lng` = **起点的坐标**（有就给）：服务端拿它把候选**拉到身边**。
     实测（`_scratch/_t_amap_tips.py`）：不给它，敲「站」第一屏是合肥站/北京站/
     大连站；给了（无锡）就是站前商贸城/无锡站(北进站口)。「服」那一屏更直白
     —— 给了之后头两条就是**京沪高速上的梅村服务区**。
   ⚠️ 起点还没定就不带（服务端会退回"按出口 IP 就近"），**不许**为这个先编一个
     起点出来 —— 那是拿一个没发生的位置去决定给人看什么。 */
const fetchSearch = (kw, full) => fetchJSON(
  '/amap/search?kw=' + encodeURIComponent(kw) + (full ? '&mode=full' : '')
  + (origin ? ('&lat=' + encodeURIComponent(origin.lat)
               + '&lng=' + encodeURIComponent(origin.lng)) : ''));
const fetchRoute = (org, d) => fetchJSON(
  '/amap/route?olat=' + org.lat + '&olng=' + org.lng +
  '&dlat=' + d.lat + '&dlng=' + d.lng +
  '&name=' + encodeURIComponent(d.name || '') +
  '&addr=' + encodeURIComponent(d.address || ''));

/* ---------------------------------------------- 搜（起点 / 终点都走这儿）
   ★★ 2026-09-25 用户拍板改了两件事，这一块现在是那个新口径：
     ① 原话「我点搜索路线 你要出现路线啊」→ 「搜索路线」按一次要**尽量把这趟

        · **同一个词只问一次**：会话内缓存，连"没搜到"也缓存 —— 改一个字回来

        · 高德回限流码（10003 日配额 / 10004 一分钟窗 / 10019·10020·10021 各种

          （照实说，不假装还在搜）。
      ⚠️ 拼音**没上屏之前不问**（`isComposing`）：用中文输入法敲「无锡站」，键盘

         问了就是白烧配额。所以打字这条路对 IME 是**上屏那一下才算一次输入**。
   🔴 **2026-09-25 用户又补了一句：「比如我输了一个字 它相关的地点要自动弹出让我
      选择啊」** —— 他打一个字，屏幕上什么都没发生。查下来根因两条：
        ① **一个字在 `v3/place/text` 上真的搜不出东西**：当场量的，

      → 于是立了一条规矩：**文字进框 → 下拉框一定冒出来**。有候选就摆候选，
        没有就摆一行 `listNote()`：正在问 / 为什么没有 / 下一步该怎么办。
      ⚠️ 所以 `#dstList` 里**不只有 button**，还有 `.dtip` 那种纯文字行 ——
        `XQ.nav.state().list` 数的是 `button`，别把那行也数进去。
   🔴🔴 **2026-09-26 用户第四次追这一条**：「我在起点终点每输入一个字 都要有相关

      页面自己的毛病**（服务端那边另说，见 `ui/amap.py` 的 `search()` 文首：搜索

        ① **`busy` 那一条是"丢掉"，而且是丢掉之后不重排**（`_t_nav_type.py`

           "打字的时候它不推荐"。

           看起来是灵的。

        等于没发生。

        补上**，不是靠缩短防抖。
   ★ 点候选**不猜**：只有高德回来的第一条名字和敲的**一字不差**时才自动用它
     （那不是猜，是没有歧义）；否则一律把候选摆出来让人点 —— 高德的关键词是
     模糊匹配，拿废话去搜它也会硬凑几条。
     ⚠️ **这条判据和 `full` 是一对**：服务端并进来的 `place/text` 排**在最前**
       （`ui/amap.py::search()`，那里记了为什么 —— tips 先放会把 `lim` 填满、
       合并等于没做）。所以上屏那条路上"第一条"= **`place/text` 的头一名**。
       2026-09-26 实测过，换序之后判据没坏：敲「无锡站」头一名还是「无锡站」
       （照样自动用），敲「无锡」头一名是「无锡市」（摆表 —— 本来就该摆）。
       以后要是再动服务端那个顺序，这一段和 `_scratch/_t_amap_full.py` 一起看。
