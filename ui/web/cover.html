/* =========================================================================
   10 展示封面 —— 本页唯一的页面级样式
   -------------------------------------------------------------------------
   这一页要当 PPT 的封面用，左导航会把画面切掉一块（左边一列按钮），
   整页就不像一张"幻灯片"了。所以本页把它**藏掉**，主区收成一列：

     · 左导航只藏不删 —— 元素还留在 DOM 里，chrome.js 照常往里生成内容
       （十个页面的索引用不着在这一页露脸，别的页都有），检查脚本数元素
       时也数得到。删掉元素的话 chrome.js 里那个 `if` 会静默跳过，以后想恢复
       就得想起这里少写过什么。
     · 气候栏**不用再管了**：它已经整条删掉（`XQ.climateHTML` 不存在了，
       十二个页面里的 `<footer class="climate">` 也一并去了），所以这里
       不再需要 `body.cover .climate{ display:none }` 那条。
     · 顶栏**保留**：灵途智行标志组 + 中间那行项目主题文字是十页共用的一条，
       封面去掉它就和整个作品集不是一套东西了。
       ★ 2026-09-24 改：顶栏右边原来那条「天气 / 联网 / 语音状态」整组已经删掉，
       换成**本页独有**的院徽（logo:true）。所以本页顶栏现在是
       「左品牌 / 中标题 / 右院徽」—— 座舱那 11 页的右侧是空的。

   另外两条：`.cover-stage` 要吃满剩下的高度（否则封面缩在上半屏），
   特性胶囊里那三个小图标得给个尺寸（全局没有 svg 兜底尺寸，不写就是 300×150，
   会把整条胶囊撑爆）。
   ★ 2026-09-24：原来最后那条给的是**眉标**图标（`.eyebrow svg`），
   眉标胶囊删掉之后那条就是死规则了；尺寸照旧、选择器换成新的 `.feat .ic svg`
   （pages.css 里也有一条同值的，留着是因为**没加载 pages.css 时这页也得站得住**）。
   ★ 2026-09-25：pages.css 那边把三枚图标的字号**各自微调**了（eye 调小、heart
   调大并上移，视觉重量对齐，见那一处的长注释）。这一条兜底**故意保持统一
   1.6rem 不动** —— 它管的是"pages.css 没加载"这个极端情况，那时对齐与否没人看，
   能站住就行；真去同步那三个数，等于同一组常量写两份。
   ========================================================================= */
body.cover .main.sub{ grid-template-columns:minmax(0,1fr); padding:1.1rem 2.2rem .9rem; }
/* ⚠️ 这一条必须写成 `.main.sub` 两层，**不能**图省事写成 `body.cover .sub-body`。
   `pages.css` 里有一条 `.main.sub .sub-body{ grid-column:2; grid-row:1; }`
   （那是给对话页的两列网格用的），它的特异度是 **(0,3,0)**；而
   `body.cover .sub-body` 只有 (0,2,1) —— **输**。于是封面这一格会被塞进
   **隐式的第 2 列**，而本页的网格只有一列（上面刚覆写成 `minmax(0,1fr)`），
   隐式列按内容定宽 -> `.sub-body` 塌成 844px（视口 1672），
   `.cover-l{max-width:58%}` 再按这个窄框算 -> 三个胶囊被压成竖排的圆，
   标题也被小瑞压住。2026-09-24 就是这么坏掉的，别改回去。
   `.main.sub .sub-body`（(0,3,0)）**平手但排在后面**，所以这里再带一层
   `body.cover` 得到 (0,3,1) 才能稳赢 —— 光靠"写在后面"是不够的。 */
body.cover .main.sub .sub-body{ grid-column:1; }
body.cover .rail{ display:none; }
body.cover .cover-stage{ flex:1 1 auto; }
body.cover .cover-feats .ic svg{ width:1.6rem; height:1.6rem; }

/* ---------------------------------------------------------------------------
   ★ 2026-09-24：13.png 的顶栏里，标题两侧各有一道把三块东西串起来的装饰：
   从品牌（或院徽）那头拉一条**细实线**过来，离标题一个身位处换成一小段
   **点刻线**，再收成一个**椭圆珠节点**，然后才是标题。本站顶栏原来什么都没有。

   位置**不是写死的百分比**，是 `cover.html` 末尾那段 JS 按实测矩形摆的
   （取 `#tbTitle` / `.lingtu-lockup` / `.collab` 的 rect），所以字号、rem、
   标题字数怎么变，它都跟着走。这里只管长相。
   ⚠️ 品牌那一头取的是 `.lingtu-lockup`（那**一张整 lockup**），
      不是 `.brand` —— `.brand` 里还跟着系统副标题 `.tb-sub`，
      量它的话这条线会被推到副标题右边去，和参考图里"从品牌拉出来"不是一回事。

   ⚠️ **一开始还照着做了两条"半透明斜切缎带"，是错的、已删**：那是我看 1x 截图
      时把背景当成了图形。后来把参考图的顶栏按列做差（拿 y=20 那行当基线），
      左半边除了 y≈55 那一行**根本没有别的差异行** —— 也就是说 13.png 的顶栏里
      只有**线**，没有面。缎带摆上去就是两条灰方块，比不做还难看
      （见 `runs/_cover_v7.png`）。教训：**先做差，再照着画**。
      （`_cmp_traces.png` 是放 4 倍后的参考局部，线、点刻、珠子都看得清。）

   ⚠️ 为什么写在本页的 <style> + 本页的 JS 里，而不是加进 chrome.js：
      `.topbar` 那三格是 `XQ.clockHTML` 生成的**共用模板**，11 个页面都在用。
      为封面一道装饰去改它，等于让每页都多出两个只有本页用得上的空元素；
      而且那是个模板字符串，本项目在反引号上踩过五次
      （见 chrome.js 里那段警告和 `_scratch/_js_template_scan.py`），能不进就不进。
      写在 `body.cover` 下面 = **只有本页生效**，chrome.js 一个字节不动。
   ⚠️ `.topbar` 在 style.css 里是 `display:grid` 且**没有**定位上下文，
      所以下面补了 `position:relative`，否则这两个绝对定位元素会跑去认
      `body` 当包含块、贴到整页的角上。
   ⚠️ `pointer-events:none`：这两条线横穿顶栏，会盖住顶栏上任何可点区域。
   ⚠️ 只在 ≥1180px 显示：窄屏下顶栏三格会挤/换行，按 rect 摆的东西会飘到字上。
   --------------------------------------------------------------------------- */
body.cover .topbar{ position:relative; }
body.cover .topbar .trace{
  position:absolute; top:52%; height:0; display:none; pointer-events:none;
  border-top:1.5px solid rgba(120,170,235,.75);
}
/* 点刻线：压在实线**上方**一点（参考图里点刻在 y≈47、实线在 y≈55），
   位置在珠子的**外侧**（离标题远的那一边） */
body.cover .topbar .trace::before{
  content:''; position:absolute; top:-.55rem; width:4.7rem;
  border-top:2px dotted rgba(120,170,235,.9);
}
body.cover .topbar .trace.a::before{ right:1.7rem; }
body.cover .topbar .trace.b::before{ left:1.7rem; }
/* 珠子：一个横放的椭圆环，**中心落在实线的内端**（靠标题那头） */
body.cover .topbar .trace::after{
  content:''; position:absolute; top:-.65rem; width:2.6rem; height:1.3rem;
  box-sizing:border-box; border-radius:50%;
  border:2px solid rgba(110,165,235,.85); background:rgba(255,255,255,.55);
}
body.cover .topbar .trace.a::after{ right:-1.3rem; }
body.cover .topbar .trace.b::after{ left:-1.3rem; }
@media (min-width:1180px){
  body.cover .topbar .trace{ display:block; }
}

/* ---------------------------------------------------------------------------
   ★ 2026-09-25：品牌片头播放器（`assets/lingtu_intro.mp4`，15.04 s 的标识演绎）。

   **用户 2026-09-25 当天把方案改过两次，这里记的是最后那版**：
     ① 最初拍板「静音自动播吧」→ 我做成"进封面就自己放、静音"。
     ② 当天用户实测后推翻，原话：「而且为啥没有重新再看一遍的机会 就是返回不了
        感觉还是自己点启动不启动吧 自己点播放键 还有声音 然后进入展示页」。
     所以现在是这样 —— **不是自动播，是封面上一颗播放键**：
       · 默认一个字节都不下（`preload="none"`、标签上没有 `autoplay`）；
       · 人点「观看品牌片」→ 全屏、**带声音**、带浏览器自带控制条地放；
       · 播完（或点「进入展示页」）化掉，露回封面；
       · **那颗键一直在** ⇒ 想看几遍看几遍，没有"一次会话只播一次"那种锁。
     ⚠️ 「一次会话只播一次」（sessionStorage）**已经整个删掉**了。用户抱怨的
        「返回不了」就是它造成的：`?intro=1`/自动播那版播过一次就记上了，
        从座舱退回封面时它认定"看过了"不再放，而页面上又没有任何地方能重看。
        **别再把它加回来** —— 那条规矩对"自动弹出来的东西"合理，对"人自己点的
        按钮"不成立（我自己点的，凭什么不让我再点）。
     ⚠️ 声音能响不是运气：**"自动播放"才被政策逼着静音**，用户手势触发的
        播放是可以带声的。所以这一版比上一版**更稳**，不是更冒险。
        万一还是被拒（比如浏览器设置里关了声），JS 会退回静音并说一声，见页末。

   为什么是**全屏**而不是嵌一小块：那一版片子是**近黑底**的（深色城市路网），
   而本页是亮色调（用户 09-23 定的「封面要投屏、深底投出来发灰」）。
   嵌成一个小方块 = 浅蓝展板上的一块黑补丁；**全屏播的这 15 秒里整屏就是那张
   片子**，黑底反而成立。播完化掉，下面的封面一个字都没动。

   ⚠️ `object-fit:contain` **不是** `cover`。片子是 1920×816 = **2.35:1**，
      用 cover 会让上下各裁掉约 12%（路网边缘和最后一帧那个标志会被切）。
      而**黑底下那两条 letterbox 是看不见的** —— 这是这张片子的性质，
      不是"退而求其次"。换一张亮底的片子这条就要重想。

   ⚠️ `z-index:9999` + `position:fixed`：它在**所有东西之上**，包括左下角
      那块 CHERY 和右下角那一对按钮（「观看品牌片」和它后面的「进入座舱」）。
      所以**退出路径必须齐** —— 少了任何一条，人就被关在封面外面，
      见页末那段 JS 顶上那四条。
   ⚠️ 顺带一句：正因为这层盖着「进入座舱」，**「进入展示页」那颗按钮是必需的
      退出口，不是装饰**。别因为"反正播完自己会收"就把它省掉 ——
      它管的是"人不想看"，而 15 秒在答辩现场是很长的一段时间。
   ⚠️ 片头**只在本页**。座舱内那 11 页不播 —— 同一个道理让用户改过一次顶栏
      （同一句话在一屏里出现两遍），片头同理，进座舱之后没有人想再看一遍。
   --------------------------------------------------------------------------- */
/* ⚠️⚠️ **默认 `display:none`，由 JS 加 `.on` 才显示** —— 这是这一块能安全存在
   的前提，别反过来写。三个好处，每一个都是必要的：
     ① **脚本没跑到（或报了错）时，片头根本不存在** —— 它是纯附加层，
        最坏的结果只能是"没有片头"，不可能是"黑屏挡住进不去"；
     ② `?intro=0`（测试/不想看）**一次绘制都不会闪** —— 若是"默认显示、
        脚本再收掉"，那会先闪一下黑屏，而这层是全屏不透明的；
     ③ 进门那颗键也**默认 `hidden`**（写在 HTML 里，脚本跑到才摘）——
        同一个道理：脚本没跑就"没有这颗键"，不会是"有一颗点了不动的键"。
   `.gone` 只负责淡出（要过渡），**彻底收掉靠 JS 把 `.on` 摘掉** ——
   摘了 `.on` 就回到这一条的 `display:none`，不用再加一个类去跟 `.on` 比权重。 */
body.cover .intro{
  position:fixed; inset:0; z-index:9999; background:#000;
  display:none; align-items:center; justify-content:center;
  transition:opacity .55s ease;
}
body.cover .intro.on{ display:flex; }
body.cover .intro.gone{ opacity:0; pointer-events:none; }
body.cover .intro-v{ width:100%; height:100%; object-fit:contain; display:block; }
/* 「进入展示页」那颗，摆**右上角**。
   ⚠️ 原来是右下角（对着「进入座舱」的位置），这次**必须让开**：现在播放器带
      浏览器自带控制条（`controls`），那一条就贴在画面**下缘**，摆在右下角会
      和控制条的"全屏/音量"挤在一起，点哪一个是哪一个都说不清。
   ⚠️ 它是深底上的浅字，不要跟着亮色主题走。 */
/* ★ 2026-09-25 晚：这颗「进入展示页 ›」**加重了一档**（原来 10% 白底 + 38% 白描边
   在片子最亮的几帧上几乎看不见）。起因是用户报「全屏后为啥我的展示页面那些都不能
   点了」—— 一半是"这层盖子本来就该点不动"（他理解成了页面坏了），另一半正是
   这颗键**太轻**：片子上只有它一条出路，它不该长得像装饰。
   ⚠️ 改的是"看得见"，**不是**位置和尺寸的量法：right/top 还是原来那两个值，
      没动布局，只是深底 + 亮边 + 影子把它从画面里拔出来。
   ⚠️ `z-index:2`：视频是 0 层，它在上面；写出来是为了别被后加的东西盖过去。 */
body.cover .intro-shut{
  position:absolute; right:2.2rem; top:2rem; z-index:2;
  font:inherit; font-size:1.05rem; letter-spacing:.08em;
  color:#fff; background:rgba(8,14,24,.82);
  border:1px solid rgba(255,255,255,.72); border-radius:2rem;
  padding:.6rem 1.5rem; cursor:pointer;
  box-shadow:0 .25rem 1.2rem rgba(0,0,0,.6);
  transition:background .2s ease, border-color .2s ease, transform .2s ease;
}
body.cover .intro-shut:hover{ background:rgba(20,34,52,.95);
  border-color:#fff; transform:translateY(-.08rem); }
/* ★ 跟着它一起加的那行小字。见 HTML 里那段注释：它干的是"解释自己"的活 ——
   屏幕上必须有一个字告诉人"这是片子、播完会自己回去"，否则被盖住的封面看起来
   就是"坏了"。`pointer-events:none` **不能省**：它压在视频上，吃掉一次点击
   就少一个出口。 */
body.cover .intro-hint{
  position:absolute; right:2.2rem; top:5.4rem; z-index:2;
  font-size:.86rem; letter-spacing:.06em; color:rgba(255,255,255,.72);
  text-shadow:0 .1rem .4rem rgba(0,0,0,.9); pointer-events:none;
}
/* ===========================================================================
   ★★ 2026-09-25 晚：**页脚这两颗键必须画在小瑞上面。**
   ---------------------------------------------------------------------------
   这不是美观问题，是"点不动"。 `_scratch/_check_clickable.py` 量出来的事实
   （视口 1638x843，`_scratch/_probe_cover_click.py` 复现）：
       `.cover-r`        position:absolute  z-index:1     ← 小瑞那一列
       `#coverMascot`    position:relative  框 640x669  x[772,1411] y[115,783]
       `#coverMascotImg` 图片框 648x678     x[767,1416] y[93,771]
       `#introOpen`      按钮 157x44        x[1196,1353] y[711,755] ← **整个在框里**
       `#goBtn`          按钮 244x76        x[1368,1612] y[695,771] ← 左边 48px 在框里
   而 `.cover-foot` 是**静态定位**（没有 position、没有 z-index），所以页脚整个画在
   `.cover-r`（z-index:1）**下面** —— 命中测试回的是 `img#coverMascotImg`。
   后果：点「观看品牌片」的中心，浏览器把这一下交给了小瑞，
   而 `.mascot` 上挂着 `XQ.poseDeck` 那个「点一下换个形象」（live.js）——
   **按钮一下也不响应，小瑞倒是换了张图。**

   ⚠️ 修法是"把这两颗键提到最上面"，**不是**给小瑞加 `pointer-events:none`：
      那等于把用户要的"点一下换个形象"整个删掉。要治的是"谁在上面"。
   ⚠️ `position:relative` **不带任何偏移**，所以原来量好的右下角几何一个像素没动，
      只是把这两颗键从"静态层"提到了"定位层"（z-index:3 > `.cover-r` 的 1）。
   ⚠️ 已经在页面里当场试过再写进来的：加之前命中点是 `img#coverMascotImg`，
      加之后是 `button#introOpen` / `a#goBtn`（连「进入座舱」左边缘那一截也回来了）。 */
body.cover .cover-foot > .cover-play,
body.cover .cover-foot > .cover-go{ position:relative; z-index:3; }
body.cover .intro-shut:focus-visible{ outline:2px solid rgba(255,255,255,.8);
  outline-offset:2px; }
/* ★ 这里原来还有一条 `@media (prefers-reduced-motion: reduce){ .intro-v{
     visibility:hidden } }`（上一版"自动播"时的兜底：怕动的东西糊在人脸上）。
     **删掉了** —— 现在片子是人**自己点开**的，这种时候还把它藏起来才是失礼：
     人点了播放，屏幕上一个动的东西都没有，只会以为是坏的。
     "减弱动态效果"这条系统偏好管的是**自动**播放的动画，不管人主动要看的东西。 */

/* ---------------------------------------------------------------------------
   ★ 2026-09-25：封面上那颗「▶ 观看品牌片」。
   它是 `.cover-foot` 的**第三个**孩子，插在「进入座舱」前面。
   ⚠️ 必须配 `margin-left:auto`：`.cover-foot` 是 `justify-content:space-between`，
      直接插第三个孩子，画面会变成「CHERY 标在左 / 播放键在正中 / 进入在右」——

      两个按钮就并排落在右下角（`gap:1rem` 中间那道缝由 footer 出）。
      `space-between` 那段没被改：它管着「左标/右按钮」两句式，

   ⚠️ 视觉上**故意比「进入座舱」轻一档**（1.15rem 对 1.9rem、描边款对渐变实心、
      没有外发光）。展板上第一眼该看见的是"进系统"，不是"看片"。
      ⚠️ 但也**不能做成一条文字链** —— 它得一眼认得出是"能按的东西"，
      所以仍然给了完整的胶囊描边和 hover 抬升，只是把音量调小。
   ⚠️ `[hidden]` 那条不能省：本规则里的 `display:inline-flex` 出现在**作者样式**里，
      浏览器自带的 `[hidden]{display:none}` 在 UA 样式里，作者样式一律压过它 ——
      不写这一条，`?intro=0` 时 `hidden` 属性会**完全不起作用**，脚本又说不过去。
   --------------------------------------------------------------------------- */
body.cover .cover-play{
  display:inline-flex; align-items:center; gap:.55rem; flex:0 0 auto;
  margin-left:auto;
  font:inherit; font-size:1.15rem; letter-spacing:.06em;

body.cover .cover-play:hover, body.cover .cover-play:focus-visible{

body.cover .cover-play:active{ transform:translateY(0); }
body.cover .cover-play[hidden]{ display:none; }

      左边在标题右格线上，只能当"实在没辙"的兜底，位置是错的）。
   ⚠️ 窄屏（<1180px）这两个元素是 `display:none`，但**矩形的计算照样跑** ——
      无所谓（算出来是坏值也没人看），`layout()` 在 `load` 时还会再跑一次，
      那时若还是窄屏就还是隐藏的。本页是投屏用的固定尺寸页，不做 resize 监听。 */
(function () {
  const tb = document.getElementById('topbar');
  const ttl = document.getElementById('tbTitle');
  if (!tb || !ttl) return;

  /* 珠子中心到标题左边 = 45px。这是**量的**：13.png 里标题占 x 630..1044，
     左珠子中心 x≈585（630−585=45）、右珠子 x≈1092（1092−1044=48），两侧一致。
     珠子半宽 1.3rem≈19px，所以珠子右缘离标题约 25px。 */
  const GAP = 45;
  /* 线离品牌/院徽留的空。13.png 左边 87px、右边 104px；这里两侧都用 80 ——
     参考那两个数是按**它自己的**标志宽度定的，本站标志宽度不同，
     照抄反而不对称。 */
  const PAD = 80;

  const mk = (cls) => {
    const e = tb.querySelector('.trace.' + cls);
    if (e) return e;
    const i = document.createElement('i');
    i.className = 'trace ' + cls;
    tb.appendChild(i);
    return i;
  };
  const a = mk('a'), b = mk('b');

  const shown = (sel) => {
    for (const e of tb.querySelectorAll(sel)) {
      if (e.getBoundingClientRect().width > 0) return e;
    }
    return null;
  };

  function layout() {
    const r = tb.getBoundingClientRect();
    const t = ttl.getBoundingClientRect();
    /* ⚠️ 必须用 shown()：`.lingtu-lockup` 现在有**两张**（on-dark / on-light），
       被主题藏起来的那张 rect 宽高是 0，直接 querySelector 在浅色主题下会拿到
       藏起来的那张（它是 on-dark，排在前面），于是左半边那条线**根本不画**。
       2026-09-24 晚品牌组从 .lingtu 换成整张 lockup 时同步改的。 */
    const brand = shown('.lingtu-lockup') || tb.querySelector('.brand');
    const collab = shown('.collab-logo');
    /* 哪一个量不出来就**保持上一次的位置**，不要拿 0 去算 ——
       拿 0 去算正是"右边那条整个不见"的那个 bug。 */
    const put = (e, left, right) => {
      e.style.left = (left - r.left).toFixed(1) + 'px';
      e.style.right = (r.right - right).toFixed(1) + 'px';
    };
    if (brand && brand.getBoundingClientRect().right > r.left) {
      put(a, brand.getBoundingClientRect().right + PAD, t.left - GAP);
    }
    if (collab && collab.getBoundingClientRect().left > t.right) {
      put(b, t.right + GAP, collab.getBoundingClientRect().left - PAD);
    }
  }

  layout();
  window.addEventListener('load', layout);
  setTimeout(layout, 300);
  setTimeout(layout, 1200);
})();

    clearInterval(tick);
    tick = setInterval(() => {
      if (v.currentTime > 0 || !v.paused) started = true;
      if (!started) { if (Date.now() - t0 > START_GUARD) finish(); return; }
      const d = v.duration;
      if (isFinite(d) && d > 0 && v.currentTime >= d - 0.2) finish();
    }, 1000);

    /* 重看：上一遍结束时停在末帧。规范里 `play()` 对"已播完"的视频会自己回到
       开头，但那是隐式行为 —— 显式写一句，重看确实从第一帧开始。 */
    try { v.currentTime = 0; } catch (e) { /* 还没元数据；play() 本来就从 0 起 */ }

    /* ★ 这一句是**唯一的播放触发点**（标签上没有 `autoplay`，见上面 HTML 那段）。
       是**用户手势**里调用的 ⇒ 可以带声（被政策逼着静音的是"自动播放"）。
       真被拒（比如浏览器把本站的声禁了）就**退回静音重放一遍并说一声** ——
       用户要的是「还有声音」，不声不响地变哑巴比变哑巴更糟。
       ⚠️ 收掉不能靠"等 error 事件"（见上面那条 🔴），所以两段落空都接 `finish`。 */
    const p = v.play();
    if (p && p.catch) p.catch(() => {
      v.muted = true;
      const p2 = v.play();
      if (p2 && p2.catch) p2.catch(finish);
      if (window.XQ && XQ.flash) XQ.flash('浏览器没让放声音，这一遍是静音的');
    });
  }

  if (open) open.addEventListener('click', start);
})();
</script>
</body>
</html>
